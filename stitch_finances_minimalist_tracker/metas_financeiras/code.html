<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#bdcabe",
                    "on-surface": "#191c1b",
                    "secondary-fixed-dim": "#90d792",
                    "surface-variant": "#e1e3e1",
                    "surface-container-highest": "#e1e3e1",
                    "background": "#f8faf8",
                    "tertiary-fixed": "#d9e6da",
                    "surface-tint": "#1b6d24",
                    "secondary-fixed": "#abf4ac",
                    "on-tertiary-container": "#e8f5e9",
                    "primary": "#0d631b",
                    "on-error-container": "#93000a",
                    "error": "#ba1a1a",
                    "on-secondary": "#ffffff",
                    "tertiary": "#4d5950",
                    "surface": "#f8faf8",
                    "on-tertiary-fixed-variant": "#3e4a41",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#88d982",
                    "surface-container": "#eceeec",
                    "on-primary-fixed-variant": "#005312",
                    "inverse-primary": "#88d982",
                    "on-primary": "#ffffff",
                    "surface-container-low": "#f2f4f2",
                    "on-secondary-container": "#2e7238",
                    "surface-dim": "#d8dad9",
                    "secondary-container": "#abf4ac",
                    "surface-bright": "#f8faf8",
                    "on-secondary-fixed-variant": "#07521d",
                    "error-container": "#ffdad6",
                    "on-error": "#ffffff",
                    "on-primary-fixed": "#002204",
                    "on-tertiary": "#ffffff",
                    "inverse-surface": "#2e3130",
                    "inverse-on-surface": "#eff1ef",
                    "primary-fixed": "#a3f69c",
                    "on-primary-container": "#cbffc2",
                    "on-surface-variant": "#40493d",
                    "tertiary-container": "#657167",
                    "outline-variant": "#bfcaba",
                    "on-background": "#191c1b",
                    "secondary": "#286b33",
                    "primary-container": "#2e7d32",
                    "surface-container-high": "#e6e9e7",
                    "on-tertiary-fixed": "#131e17",
                    "on-secondary-fixed": "#002107",
                    "outline": "#707a6c"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "12px",
                    "lg": "40px",
                    "container-margin": "20px",
                    "base": "8px",
                    "xl": "64px",
                    "md": "24px",
                    "xs": "4px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "headline-md": ["Inter"],
                    "label-sm": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "body-md": ["Inter"],
                    "display": ["Inter"],
                    "headline-lg": ["Inter"],
                    "label-md": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "display": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8faf8; /* background from theme */
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .animate-subtle-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(13, 99, 27, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen text-on-surface">
<!-- TopAppBar -->
<header class="w-full top-0 sticky flex items-center justify-between px-container-margin h-16 w-full bg-surface z-50">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary" data-icon="savings">savings</span>
<span class="font-headline-md text-headline-md font-bold text-primary">Finances</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="close">close</span>
</button>
</header>
<main class="flex-grow px-container-margin pt-base pb-xl max-w-md mx-auto w-full">
<!-- Progress Indicator -->
<div class="mt-md mb-lg">
<div class="flex justify-between items-center mb-xs">
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wider">Passo 3 de 4</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Metas de Longo Prazo</span>
</div>
<div class="h-2 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full w-3/4 transition-all duration-700 ease-out"></div>
</div>
</div>
<!-- Question Header -->
<div class="mb-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Você possui alguma meta?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Definir objetivos claros nos ajuda a criar um plano de economia personalizado para você.</p>
</div>
<!-- Visual Anchor (Illustrative Element) -->
<div class="relative w-full h-48 bg-surface-container-low rounded-xl mb-lg overflow-hidden flex items-center justify-center">
<div class="absolute inset-0 opacity-10">
<div class="absolute top-0 left-0 w-full h-full bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary/20 via-transparent to-transparent"></div>
</div>
<div class="animate-subtle-float flex flex-col items-center">
<span class="material-symbols-outlined text-primary-container text-[64px]" data-icon="flag" style="font-variation-settings: 'FILL' 1;">flag</span>
</div>
</div>
<!-- Form Layout -->
<form class="space-y-md">
<!-- Goal Name -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="goal-name">Nome da meta</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-lowest border-2 border-surface-container-high rounded-xl px-4 font-body-md text-body-md transition-all focus:border-primary focus:bg-white" id="goal-name" placeholder="Ex: Viagem, Carro Novo, Reserva" type="text"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant" data-icon="edit">edit</span>
</div>
</div>
<!-- Goal Value and Deadline (2-Column Grid) -->
<div class="grid grid-cols-2 gap-gutter">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="goal-value">Valor desejado</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-lowest border-2 border-surface-container-high rounded-xl px-4 font-body-md text-body-md transition-all focus:border-primary focus:bg-white" id="goal-value" placeholder="R$ 0,00" type="text"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="goal-deadline">Prazo (meses)</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-lowest border-2 border-surface-container-high rounded-xl px-4 font-body-md text-body-md transition-all focus:border-primary focus:bg-white" id="goal-deadline" placeholder="12" type="number"/>
</div>
</div>
</div>
<!-- Quick Suggestions (Chips) -->
<div class="pt-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-sm block">Sugestões comuns:</span>
<div class="flex flex-wrap gap-xs">
<button class="px-4 py-2 rounded-full bg-secondary-container/50 text-on-secondary-container font-label-md text-label-md hover:bg-secondary-container transition-colors active:scale-95" type="button">Viagem</button>
<button class="px-4 py-2 rounded-full bg-secondary-container/50 text-on-secondary-container font-label-md text-label-md hover:bg-secondary-container transition-colors active:scale-95" type="button">Reserva</button>
<button class="px-4 py-2 rounded-full bg-secondary-container/50 text-on-secondary-container font-label-md text-label-md hover:bg-secondary-container transition-colors active:scale-95" type="button">Educação</button>
</div>
</div>
</form>
</main>
<!-- Fixed Bottom Action Area -->
<footer class="sticky bottom-0 w-full px-container-margin pb-xl pt-md bg-gradient-to-t from-background via-background to-transparent">
<div class="max-w-md mx-auto">
<button class="w-full h-[56px] bg-primary text-on-primary font-headline-md text-headline-md rounded-xl shadow-[0_4px_20px_rgba(13,99,27,0.15)] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-sm">
                Finalizar
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<p class="text-center mt-md font-label-sm text-label-sm text-on-surface-variant px-lg">
                Ao finalizar, calcularemos sua jornada financeira automaticamente.
            </p>
</div>
</footer>
<!-- Decorative Soft Glow Background Elements -->
<div class="fixed top-1/4 -right-20 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="fixed bottom-1/4 -left-20 w-64 h-64 bg-secondary/5 rounded-full blur-3xl pointer-events-none -z-10"></div>
<script>
        // Simple Interaction for suggestions
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.getElementById('goal-name').value = this.innerText;
                
                // Visual feedback
                this.classList.add('bg-primary', 'text-on-primary');
                setTimeout(() => {
                    this.classList.remove('bg-primary', 'text-on-primary');
                }, 400);
            });
        });

        // Simple Currency Mask logic (conceptual)
        const valueInput = document.getElementById('goal-value');
        valueInput.addEventListener('blur', function() {
            let val = this.value.replace(/\D/g, "");
            if(val) {
                val = (parseFloat(val) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                this.value = val;
            }
        });
    </script>
</body></html>
