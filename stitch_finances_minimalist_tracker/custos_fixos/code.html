<!-- Hidden Navigation Shell Logic - Transactional/Onboarding page suppresses nav per instructions -->
<script>
        // Simple Currency Mask for Demo
        const input = document.getElementById('currency-input');
        input.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, "");
            value = (value / 100).toFixed(2) + "";
            value = value.replace(".", ",");
            value = value.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
            e.target.value = value === "NaN" ? "" : value;
        });

        // Focus interaction
        input.addEventListener('focus', () => {
            input.parentElement.classList.add('scale-[1.02]');
        });
        input.addEventListener('blur', () => {
            input.parentElement.classList.remove('scale-[1.02]');
        });
    </script>
